<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="home-hero">

    <!-- HEADER -->
    <header class="home-header">
      <div class="home-logo">NETFLIX</div>

      <div class="home-header-right">
        <select class="home-language">
          <option>English</option>
          <option>Bahasa Indonesia</option>
        </select>

        <a href="login.html" class="home-signin">Sign In</a>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="home-content">
      <h1>Unlimited movies, TV Shows<br>and more.</h1>
      <h2>Watch anywhere. Cancel anytime.</h2>

      <div class="home-email-box">
        <input type="email" placeholder="Email address" />
        <button class="home-try-btn">TRY 30 DAYS FREE</button>
      </div>

      <p class="home-small-text">
        Ready to watch? Enter your email to create or restart your membership
      </p>
    </div>

  </section>

</body>
</html>
