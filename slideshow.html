<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Features</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slideshow">

  <!-- SLIDE 1 -->
  <div class="slide active">
    <div class="slide-text">
      <h1>Enjoy on your TV</h1>
      <p>
        Watch on smart TV, PlayStation, Xbox, Chromecast,
        Apple TV and more.
      </p>
    </div>
    <img src="tvnetflix.jpeg" class="slide-image">
  </div>

  <!-- SLIDE 2 -->
  <div class="slide">
    <img src="hpnetflix.jpeg" class="slide-image">
    <div class="slide-text">
      <h1>Download your shows to watch offline</h1>
      <p>
        Save your favourites easily and always have
        something to watch.
      </p>
    </div>
  </div>

</div>

<script src="slideshow.js"></script>
</body>
</html>
